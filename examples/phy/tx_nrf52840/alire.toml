name = "tx_nrf52840"
description = "Example using the AdaBee PHY for packet transmission on the nRF52840"
version = "0.1.0-dev"

authors = ["Daniel King"]
maintainers = ["Daniel King <damaki.gh@gmail.com>"]
maintainers-logins = ["damaki"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["tx_nrf52840"]

[build-switches]
"*".ada_version = "Ada2022"

[[depends-on]]
adabee_phy = "*"
light_tasking_nrf52840 = "^15.4.0"
gnatprove = "^15"

[[pins]]
adabee_phy = { path = "../../../phy" }

[configuration.values]
adabee_phy.Driver = "nRF52840"
